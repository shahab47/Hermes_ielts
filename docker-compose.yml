version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ielts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_dev}
      POSTGRES_DB: ielts_learning
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_learning"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  learning-service:
    build:
      context: ./apps/learning-service
      dockerfile: Dockerfile
    container_name: ielts-learning-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IELTS_DATABASE_URL: postgresql+psycopg://ielts:${POSTGRES_PASSWORD:-ielts_dev}@postgres:5432/ielts_learning
      IELTS_DEBUG: ${DEBUG:-false}
      IELTS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IELTS_LOG_FORMAT: json
    ports:
      - "${LEARNING_SERVICE_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
