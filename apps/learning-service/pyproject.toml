[project]
name = "ielts-learning-service"
version = "0.1.0"
description = "Domain learning service, FSRS scheduler, and MCP server for IELTS Personal Learning Agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "fsrs>=6.3.2",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "pyright>=1.1.385",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
